apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "tracing-admission-webhook.fullname" . }}.sigs.k8s.io
  {{- if .Values.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "tracing-admission-webhook.fullname" . }}-serving-cert
  {{- end }}
  labels:
    {{- include "tracing-admission-webhook.labels" . | nindent 4 }}
webhooks:
  - name: traceparent.tracing.k8s.io
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    matchPolicy: Equivalent
    reinvocationPolicy: {{ .Values.webhook.reinvocationPolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            {{- range .Values.webhook.excludedNamespaces }}
            - {{ . | quote }}
            {{- end }}
            {{- if not (has .Release.Namespace .Values.webhook.excludedNamespaces) }}
            - {{ .Release.Namespace | quote }}
            {{- end }}
        - key: tracing.k8s.io/exclude-webhook
          operator: DoesNotExist
    clientConfig:
      {{- if .Values.webhook.caBundle }}
      caBundle: {{ .Values.webhook.caBundle | quote }}
      {{- end }}
      service:
        name: {{ include "tracing-admission-webhook.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: /mutate
        port: {{ .Values.service.port }}
    rules:
      {{- toYaml .Values.webhook.rules | nindent 6 }}

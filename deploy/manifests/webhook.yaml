apiVersion: v1
kind: Namespace
metadata:
  name: tracing-system
  labels:
    app.kubernetes.io/name: tracing-admission-webhook
    tracing.k8s.io/exclude-webhook: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tracing-admission-webhook
  namespace: tracing-system
  labels:
    app.kubernetes.io/name: tracing-admission-webhook
---
apiVersion: v1
kind: Service
metadata:
  name: tracing-admission-webhook
  namespace: tracing-system
  labels:
    app.kubernetes.io/name: tracing-admission-webhook
spec:
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
  selector:
    app.kubernetes.io/name: tracing-admission-webhook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracing-admission-webhook
  namespace: tracing-system
  labels:
    app.kubernetes.io/name: tracing-admission-webhook
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tracing-admission-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracing-admission-webhook
    spec:
      serviceAccountName: tracing-admission-webhook
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: registry.k8s.io/tracing-admission-webhook/tracing-admission-webhook:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --tls-cert-file=/etc/webhook/certs/tls.crt
            - --tls-key-file=/etc/webhook/certs/tls.key
            - --port=8443
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: webhook-certs
              mountPath: /etc/webhook/certs
              readOnly: true
      volumes:
        - name: webhook-certs
          secret:
            secretName: tracing-admission-webhook-tls
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: tracing-admission-webhook-selfsigned
  namespace: tracing-system
  labels:
    app.kubernetes.io/name: tracing-admission-webhook
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tracing-admission-webhook-serving-cert
  namespace: tracing-system
  labels:
    app.kubernetes.io/name: tracing-admission-webhook
spec:
  dnsNames:
    - tracing-admission-webhook.tracing-system.svc
    - tracing-admission-webhook.tracing-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: tracing-admission-webhook-selfsigned
  secretName: tracing-admission-webhook-tls
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: tracing-admission-webhook.sigs.k8s.io
  annotations:
    cert-manager.io/inject-ca-from: tracing-system/tracing-admission-webhook-serving-cert
  labels:
    app.kubernetes.io/name: tracing-admission-webhook
webhooks:
  - name: traceparent.tracing.k8s.io
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: Ignore
    matchPolicy: Equivalent
    reinvocationPolicy: Never
    timeoutSeconds: 5
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - tracing-system
        - key: tracing.k8s.io/exclude-webhook
          operator: DoesNotExist
    clientConfig:
      service:
        name: tracing-admission-webhook
        namespace: tracing-system
        path: /mutate
        port: 443
    rules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources:
          - deployments
          - replicasets
          - statefulsets
          - daemonsets
        scope: Namespaced
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources:
          - jobs
          - cronjobs
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources:
          - pods
          - replicationcontrollers
        scope: Namespaced
